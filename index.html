<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason Lu | Linktree</title>
    <!-- Favicon -->
    <link rel="icon" href="https://jsnnlogs.com/wp-content/uploads/2024/04/logs.png" type="image/x-icon" />
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <a id="profilePicture" href="#popup">
      <img src="https://avatars.githubusercontent.com/u/87420538?v=4" alt="Profile Picture">
    </a>

    <div class="overlay" id="popup">
      <div class="popup">
        <div class="popup-photo">
          <a href="https://avatars.githubusercontent.com/u/87420538?v=4" target="_blank">
            <img src="https://avatars.githubusercontent.com/u/87420538?v=4" alt="Profile Picture">
          </a>
        </div>
        <a class="popup-close" onclick="history.back()">&times;</a>
      </div>
    </div>

    <div id="userName">
      @Jsnn
    </div>

    <div id="links">
      <a class="link" href="https://github.com/Jsnnmsc" target="_blank">
        <i class="fab fa-github">&nbsp;</i>Github
      </a>
      <a class="link" href="https://www.linkedin.com/in/po-hsun-lu/" target="_blank">
        <i class="fab fa-linkedin">&nbsp;</i>Linkedin
      </a>
      <a class="link" href="https://jsnnlogs.com/" target="_blank">
        <img src="https://jsnnlogs.com/wp-content/uploads/2024/04/logs.png" alt="Personal Blog Logo" style="height: 20px; vertical-align: middle;">&nbsp;Personal Blog
      </a>
    </div>

    <div id="hashtag">
      What's up!
    </div>
  </body>
</html>
